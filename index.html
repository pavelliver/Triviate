<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triviate</title>
<meta name="description" content="Triviate: a pass-the-phone trivia board game for 2 to 5 teams. Rate yourself from 1 to 5, answer, and race to the Reckoning.">
<meta name="theme-color" content="#12101F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triviate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/nunito-700.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fredoka";font-weight:500;font-display:swap;src:url(fonts/fredoka-500.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:600;font-display:swap;src:url(fonts/fredoka-600.woff2) format("woff2")}
@font-face{font-family:"Fredoka";font-weight:700;font-display:swap;src:url(fonts/fredoka-700.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:400;font-display:swap;src:url(fonts/nunito-400.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:600;font-display:swap;src:url(fonts/nunito-600.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:700;font-display:swap;src:url(fonts/nunito-700.woff2) format("woff2")}
@font-face{font-family:"Nunito";font-weight:800;font-display:swap;src:url(fonts/nunito-800.woff2) format("woff2")}
html,body{margin:0;background:#12101F;color:#F5F3FF}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
html body .ry{
  padding-top:max(16px,env(safe-area-inset-top));
  padding-bottom:max(40px,env(safe-area-inset-bottom));
  padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right));
}
#boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  font:700 15px/1.4 Nunito,system-ui,sans-serif;color:#B8B2D9}
#boot img{width:96px;height:96px;border-radius:24px}
#boot b{font:700 32px/1 Fredoka,Nunito,system-ui,sans-serif;color:#F5F3FF}
</style>
<script>
window.__triviateApp = true;
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  window.__triviateInstall = e;
  window.dispatchEvent(new Event("triviate-installable"));
});
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</head>
<body>
<div id="root">
  <div id="boot"><img src="icons/icon-192.png" alt=""><b>Triviate</b><span>Setting out the board…</span></div>
</div>
<noscript><p style="padding:24px;font-family:system-ui">Triviate needs JavaScript to run.</p></noscript>
<script src="app.js" defer></script>
</body>
</html>
